<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Register</title>
</head>
<body class="bg-[#111111]">
        <p class="text-white ml-4"><a href="./index.html" class="text-cyan-500 hover:text-red-700">Go back</a></p>
    <div class="flex items-center justify-center h-screen">
        <form class="bg-white p-6 rounded shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4">Register</h2>
            <div class="mb-4">
                <label for="username" class="block text-gray-700">Username</label>
                <input type="text" id="username" name="username" class="w-full px-3 py-2 border rounded">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700">Email</label>
                <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="w-full px-3 py-2 border rounded">
            </div>
            <a href="./index.html" class="w-full bg-red-500 text-white py-2 px-8 w-full flex justify-center rounded hover:bg-red-600 transition">Register</a>
        </form>
    </div>
    
</body>
</html>
